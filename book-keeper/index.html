<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture in Picture</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!-- Open Modal -->
    <h1 id="show-modal">Add Modal</h1>

    <!-- bookmarks -->
    <div class="container" id="bookmark-container">
    </div>

    <!-- Modal -->
    <div class="modal-container " id="modal-container">
        <div class="modal">
            <i class="fas fa-times close-icon" id="close-modal"></i>
            <div class="modal-header">
                <h3>Add New Bookmark</h3>
            </div>
            <div class="modal-content">
                <form id="bookmark-form">
                    <div class="form-group">
                        <label for="website-name">Website Name</label>
                        <input type="text" id="website-name">
                    </div>
                    <div class="form-group">
                        <label for="website-url">Website URL</label>
                        <input type="text" id="website-url">
                    </div>
                    <button type="submit" id="submit-form">Save</button>
                </form>
            </div>
        </div>
    </div>



    <script src="script2.js"></script>
</body>

</html>
