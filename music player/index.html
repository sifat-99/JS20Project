<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <main class="container">
        <div class="img-container">
            <img src="https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?q=80&w=2574&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="">
        </div>
        <div class="title-wrapper">
            <h2 id="title">Wonders of the Earth</h2>
        </div>
        <h3 id="artist">Grand_Project</h3>
        <audio src="music/ Wonders of the Earth.mp3"></audio>
        <div class="progress-container" id="progress-container">
            <div class="progress" id="progress"></div>
            <div class="duration-wrapper">
                <span id="current-time">0:00</span>
                <span id="duration">2:48</span>
            </div>
        </div>
        <div class="buttons">
            <button class="prev" id="prev" title="Previous song"><i class="fas fa-backward"></i></button>
            <button class="play" id="play" title="Play"><i class="fas fa-play"></i></button>
            <button class="next" id="next" title="Next song"><i class="fas fa-forward"></i></button>
        </div>
    </main>


    <script src="script.js"></script>
</body>

</html>
